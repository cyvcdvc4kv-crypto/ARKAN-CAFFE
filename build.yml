name: Build One Million Caffe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        shell: bash
        run: |
          mkdir -p www electron build
          mv index.html www/index.html
          mv main.js electron/main.js
          mv preload.js electron/preload.js
          mv icon.ico build/icon.ico
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OneMillionCaffe-Windows
          path: dist/*.exe
  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [phone, sunmi]
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        shell: bash
        run: |
          mkdir -p www electron build assets
          mv index.html www/index.html
          mv main.js electron/main.js
          mv icon.ico build/icon.ico
          mv icon-only.png icon-foreground.png icon-background.png assets/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Lower JS for old WebView (Android 7)
        run: node lower.js
      - name: Sunmi printer plugin
        if: matrix.variant == 'sunmi'
        run: npm install cordova-plugin-sunmi-inner-printer || echo "sunmi plugin unavailable, continuing"
      - name: Bluetooth printer plugin
        run: npm install cordova-plugin-bluetooth-serial || echo "bluetooth plugin unavailable, continuing"
      - run: npx cap add android
      - name: Generate app icons
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor "#eaeaea" --iconBackgroundColorDark "#eaeaea" || echo "icon generation skipped"
      - run: npx cap sync android
      - name: Portrait lock (Sunmi)
        if: matrix.variant == 'sunmi'
        run: sed -i -E 's/<activity([[:space:]]|$)/<activity android:screenOrientation="portrait"\1/' android/app/src/main/AndroidManifest.xml
      - name: Stable signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OneMillionCaffe-${{ matrix.variant }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
